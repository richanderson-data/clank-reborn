[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clank-reborn"
version = "0.1.0"
description = "A local-first assistant with Ollama chat, saved conversations, project evidence, public web tools, and opt-in edit/test autonomy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clank-Reborn contributors" }]
keywords = ["ollama", "llm", "cli", "ai-assistant", "deepseek", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.34.2"]

[project.optional-dependencies]
autonomy = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
clank = "clank.cli:main"

[tool.setuptools.packages.find]
include = ["clank*"]

[tool.setuptools.package-data]
clank = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a live provider (Ollama running or DEEPSEEK_API_KEY set)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
