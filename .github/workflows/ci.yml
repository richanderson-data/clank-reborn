name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Run regression tests (no provider or API key needed)
        run: python -m pytest -q
      - name: Repository hygiene check
        run: python scripts/security_check.py --skip-history
      - name: Build installable wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel into isolated directory
        run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--target', 'installed', glob.glob('dist/*.whl')[0]])"
      - name: Verify installed package and browser assets
        run: python -I scripts/package_smoke.py installed

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
